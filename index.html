<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================== SEO básico ===================== -->
    <!-- CONFIRMAR: domínio final antes de publicar (troque em todas as tags abaixo) -->
    <title>Dentista em Mairinque | Dra. Caroline de Lima Floriano</title>
    <meta
      name="description"
      content="Consultório odontológico no Centro de Mairinque. Agende sua avaliação com a Dra. Caroline de Lima Floriano, CRO-SP 158663."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Dra. Caroline de Lima Floriano" />
    <link rel="canonical" href="https://www.draCarolineFloriano.com.br/" />

    <!-- ===================== Open Graph ===================== -->
    <meta property="og:type" content="business.business" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="Dentista em Mairinque | Dra. Caroline de Lima Floriano"
    />
    <meta
      property="og:description"
      content="Consultório odontológico no Centro de Mairinque. Agende sua avaliação com a Dra. Caroline de Lima Floriano, CRO-SP 158663."
    />
    <meta property="og:url" content="https://www.draCarolineFloriano.com.br/" />
    <meta property="og:site_name" content="Dra. Caroline de Lima Floriano - Odontologia" />
    <!-- CONFIRMAR: imagem de capa (1200x630px) para compartilhamento em redes sociais -->
    <meta property="og:image" content="/og-cover.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dentista em Mairinque | Dra. Caroline de Lima Floriano" />
    <meta
      name="twitter:description"
      content="Consultório odontológico no Centro de Mairinque. Agende sua avaliação com a Dra. Caroline de Lima Floriano, CRO-SP 158663."
    />

    <!-- ===================== Favicon ===================== -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="theme-color" content="#F8F4EC" />

    <!-- ===================== Fontes ===================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================================
         Dados estruturados (Schema.org / JSON-LD)
         Apenas informações confirmadas: nome, profissão, telefone, endereço,
         cidade, estado, país, CRO (em description) e link do mapa.
         Não inclui avaliações, preços ou horários (não confirmados).
         ===================================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Dra. Caroline de Lima Floriano",
        "description": "Cirurgiã-dentista, CRO-SP 158663.",
        "telephone": "+5511993360968",
        "url": "https://www.draCarolineFloriano.com.br/",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Monteiro Lobato, 272, Centro",
          "addressLocality": "Mairinque",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "hasMap": "https://maps.app.goo.gl/CFaMYn5NrVAHivJT9",
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -23.5477807,
          "longitude": -47.1856113
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
